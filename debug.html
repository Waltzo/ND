<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>눈담 카메라 진단</title>
<style>
/* 눈담 카메라 진단: 카메라가 실제로 무엇을 주는지(해상도, 화각, 줌)와, 추적하는 눈이 몇 픽셀로 찍히는지 봅니다.
   영상은 이 기기 안에서만 씁니다. 보내거나 저장하지 않습니다. */
:root{
  --bg:#EDF1F2;--surface:#FFFFFF;--ink:#14232B;--muted:#5A6B74;--line:#CBD5D9;--accent:#0C6A86;--signal:#D97A00;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F181D;--surface:#18252C;--ink:#E8EEF0;--muted:#93A4AC;--line:#2E3F48;--accent:#4FB6D3;--signal:#F2A33A;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;padding-bottom:calc(var(--eyes-h,200px) + 12px)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.top__name{font-weight:700;font-size:17px}
.top__name small{font-weight:400;font-size:12px;color:var(--muted);margin-left:8px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px;text-decoration:none;color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
main{padding:12px 16px;display:grid;gap:12px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}
@media (max-width:760px){main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.card h2{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.06em;margin:0 0 8px}
#view{display:block;width:100%;height:auto;border-radius:10px;background:var(--bg)}
#faceCv{display:block;width:min(100%,420px);height:auto;border-radius:10px;background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.ctl label{display:flex;gap:6px;align-items:center;font-size:14px}
.ctl select,.ctl input[type=range]{accent-color:var(--accent)}
.ctl select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 8px}
.ctl output{font-family:var(--font-num);font-size:13px;color:var(--muted);min-width:3.5em}
.ctl + .ctl{margin-top:10px}
#msg{font-size:17px;font-weight:700;margin:0 0 8px}
#msg:empty{display:none}
pre{margin:0;font-family:var(--font-num);font-size:13px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
/* 페이지 아래에 붙어 있는, 추적하는 눈을 크게 본 그림 */
.eyes{position:fixed;left:0;right:0;bottom:0;z-index:3;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px;display:flex;gap:12px;align-items:center}
.eyes canvas{flex:1;min-width:0;width:100%;height:auto;max-height:34vh;border-radius:8px;background:var(--bg)}
.eyes pre{flex:none;width:17em;font-size:12px}
@media (max-width:560px){.eyes{flex-direction:column;align-items:stretch}.eyes pre{width:auto}}
video{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
</style>
</head>
<body>

<header class="top">
  <span class="top__name">눈담<small>카메라 진단</small></span>
  <a class="btn" href="index.html">자판으로 돌아가기</a>
</header>

<main>
  <section class="card">
    <h2>카메라 영상 (거울처럼 뒤집음)</h2>
    <p id="msg" role="status">카메라를 준비하고 있습니다</p>
    <canvas id="view" width="960" height="540" aria-label="카메라 영상과 얼굴 테두리"></canvas>
    <p class="note">파란 네모는 찾은 얼굴, 주황 네모는 얼굴을 잘라 넣을 때 쓰는 범위입니다.</p>
    <h2 style="margin-top:14px">모델이 읽는 그림 (얼굴을 가운데 두고 얼굴 너비 500px 로 확대)</h2>
    <canvas id="faceCv" width="600" height="600" aria-label="얼굴을 가운데 두고 확대한 그림"></canvas>
    <p class="note" id="faceNote">얼굴을 찾으면 여기에 보입니다.</p>
  </section>

  <section class="card">
    <h2>조절</h2>
    <div class="ctl">
      <label>해상도
        <select id="res">
          <option value="1280x720">1280 x 720</option>
          <option value="1920x1080">1920 x 1080</option>
          <option value="4032x3024">가장 크게</option>
        </select>
      </label>
      <label>화각 가정
        <select id="hfov">
          <option value="122">122° (아이패드 초광각)</option>
          <option value="90">90°</option>
          <option value="60">60°</option>
        </select>
      </label>
    </div>
    <div class="ctl">
      <label for="zoom">카메라 줌</label>
      <input type="range" id="zoom" min="1" max="1" step="0.1" value="1" disabled>
      <output id="zoomOut">지원 안 함</output>
    </div>
    <div class="ctl">
      <button class="btn" id="cropBtn" type="button" aria-pressed="true">얼굴을 잘라 확대해서 읽기</button>
      <button class="btn" id="pixBtn" type="button" aria-pressed="false">눈 그림: 모델이 읽는 확대 그림</button>
      <button class="btn" id="copyBtn" type="button">값 복사</button>
    </div>
    <p class="note">얼굴을 잘라 확대해서 읽기: 화면 전체에서 얼굴을 찾은 뒤, 다음부터는 얼굴을 한가운데 두고 얼굴 너비가 500px 이 되게 키워서 눈을 읽습니다. 얼굴이 작게 찍힐 때 놓치지 않는지 볼 수 있습니다.</p>
    <h2 style="margin-top:14px">측정값</h2>
    <pre id="info">-</pre>
  </section>
</main>

<div class="eyes" id="eyes">
  <canvas id="eyeCv" width="1200" height="300" aria-label="추적하는 두 눈을 확대한 그림"></canvas>
  <pre id="eyeTx">눈을 찾는 중</pre>
</div>

<script src="gaze-core.js"></script>
<script>
(function(){
  "use strict";
  var C=window.GazeCore;
  /* gaze.js 와 같은 주소(판 고정) */
  var LIB="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.3";
  var MODEL="https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
  var $=function(id){return document.getElementById(id)};
  var view=$("view"),eyeCv=$("eyeCv"),msg=$("msg"),info=$("info"),eyeTx=$("eyeTx");
  var video=document.createElement("video");
  video.muted=true;video.playsInline=true;video.setAttribute("playsinline","");video.setAttribute("aria-hidden","true");
  document.body.appendChild(video);
  var stream=null,track=null,landmarker=null,vision=null;
  var opt={crop:true,pixel:false};   /* pixel: 눈 그림을 확대 전 원본 픽셀로 보기 */
  var inReg=null;                    /* cropCv 에 지금 들어 있는 모델 입력의 범위와 배율 {x,y,w,h,k} */
  var flushCv=document.createElement("canvas");
  var crop=null;                 /* 잘라 넣는 범위(원본 영상 픽셀): {x,y,w,h} */
  var cropCv=document.createElement("canvas"),miss=0,usedCrop=false;
  var lastVT=-1,fps=new C.FpsMeter(),inferMs=0,lastM=null,blinkIdx=null,openId=0;

  function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||"#888"}
  function say(t){if(msg.textContent!==t)msg.textContent=t}
  function why(err){
    var n=err&&err.name;
    if(n==="NotAllowedError"||n==="SecurityError")return "카메라 권한이 거부되었습니다. 브라우저 설정에서 카메라를 허용해 주세요.";
    if(n==="NotFoundError"||n==="OverconstrainedError")return "카메라를 찾지 못했습니다.";
    if(n==="NotReadableError"||n==="AbortError")return "다른 앱이 카메라를 쓰고 있어 열 수 없습니다.";
    if(n==="NoApi")return "이 브라우저에서는 카메라를 쓸 수 없습니다. https 주소로 열어 주세요.";
    if(n==="ModelLoad")return "얼굴 인식 모델을 내려받지 못했습니다. 인터넷 연결을 확인해 주세요.";
    return "카메라를 시작하지 못했습니다.";
  }

  /* ---------- 카메라 ---------- */
  function openCamera(){
    var id=++openId,wh=$("res").value.split("x");
    if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null;track=null;}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return Promise.reject({name:"NoApi"});
    return navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:"user",width:{ideal:+wh[0]},height:{ideal:+wh[1]},frameRate:{ideal:30}}}).then(function(s){
      if(id!==openId){s.getTracks().forEach(function(t){t.stop()});return;}
      stream=s;track=s.getVideoTracks()[0];crop=null;lastVT=-1;
      video.srcObject=s;
      setupZoom();
      return video.play();
    });
  }
  /* 카메라 자체 줌: 기기가 범위를 알려 줄 때만 막대를 켭니다. */
  function setupZoom(){
    var el=$("zoom"),out=$("zoomOut"),caps={},set={};
    try{caps=track.getCapabilities?track.getCapabilities():{};set=track.getSettings?track.getSettings():{};}catch(err){}
    var z=caps.zoom;
    if(z&&typeof z.max==="number"&&z.max>z.min){
      el.disabled=false;el.min=z.min;el.max=z.max;el.step=z.step||0.1;el.value=set.zoom||z.min;
      out.textContent=(+el.value).toFixed(1)+"배";
    }else{el.disabled=true;out.textContent="지원 안 함";}
  }
  $("zoom").addEventListener("input",function(){
    var v=parseFloat(this.value),out=$("zoomOut");
    out.textContent=v.toFixed(1)+"배";
    if(!track)return;
    track.applyConstraints({advanced:[{zoom:v}]}).then(function(){crop=null;},function(){out.textContent="바꾸지 못함";});
  });
  $("res").addEventListener("change",function(){
    say("카메라를 다시 여는 중입니다");
    openCamera().catch(function(err){say(why(err))});
  });
  function toggle(id,key){
    $(id).addEventListener("click",function(){opt[key]=!opt[key];this.setAttribute("aria-pressed",opt[key]);if(key==="crop")crop=null;});
  }
  toggle("cropBtn","crop");toggle("pixBtn","pixel");
  $("pixBtn").addEventListener("click",function(){this.textContent=opt.pixel?"눈 그림: 확대 전 원본 픽셀":"눈 그림: 모델이 읽는 확대 그림";});
  $("copyBtn").addEventListener("click",function(){
    var t=info.textContent+"\n"+eyeTx.textContent,b=this;
    function done(ok){b.textContent=ok?"복사했습니다":"복사하지 못했습니다";setTimeout(function(){b.textContent="값 복사"},1500);}
    try{navigator.clipboard.writeText(t).then(function(){done(true)},function(){done(false)});}catch(err){done(false);}
  });

  /* ---------- 모델 ---------- */
  function loadModel(){
    return import(LIB+"/vision_bundle.mjs").then(function(v){
      vision=v;return v.FilesetResolver.forVisionTasks(LIB+"/wasm");
    }).then(function(files){
      function make(delegate){
        return vision.FaceLandmarker.createFromOptions(files,{
          baseOptions:{modelAssetPath:MODEL,delegate:delegate},runningMode:"VIDEO",numFaces:1,
          outputFaceBlendshapes:true,outputFacialTransformationMatrixes:true
        });
      }
      return make("GPU").catch(function(){return make("CPU")});
    }).then(function(l){landmarker=l;},function(err){throw {name:"ModelLoad",cause:err};});
  }

  /* ---------- 프레임마다 ---------- */
  function readBlink(res){
    var bs=res.faceBlendshapes&&res.faceBlendshapes[0],cat=bs&&bs.categories;
    if(!cat)return null;
    if(!blinkIdx){blinkIdx={l:-1,r:-1};cat.forEach(function(c,i){if(c.categoryName==="eyeBlinkLeft")blinkIdx.l=i;else if(c.categoryName==="eyeBlinkRight")blinkIdx.r=i;});}
    if(blinkIdx.l<0||blinkIdx.r<0)return null;
    return {l:cat[blinkIdx.l].score,r:cat[blinkIdx.r].score};
  }
  /* 얼굴 둘레만 잘라 키운 그림을 모델에 넣고, 나온 좌표를 원본 영상 기준으로 되돌립니다. */
  /* 자판(gaze.js)과 같은 방법으로 읽습니다.
     따라가는 얼굴이 있으면 한가운데 두고 얼굴 너비 500px 로 키워 넣고,
     없으면 화면 전체, 그다음 화면을 겹치는 조각으로 나눠 차례로 넣어 먼 얼굴을 찾습니다. */
  var regions=null,regionIdx=0,flush=false,searching=false;
  function detect(now){
    var vw=video.videoWidth,vh=video.videoHeight,src=video,c=null,g2=cropCv.getContext("2d");
    if(flush){
      /* 범위를 바꾼 다음 프레임은 빈 그림을 넣어 모델의 이전 추적을 지웁니다 */
      flush=false;flushCv.width=64;flushCv.height=64;
      var gf=flushCv.getContext("2d");gf.fillStyle="#808080";gf.fillRect(0,0,64,64);
      landmarker.detectForVideo(flushCv,now);
      return lastM;
    }
    if(opt.crop){
      c=crop;
      if(!c){
        if(!regions||regions.vw!==vw||regions.vh!==vh){regions=C.searchRegions(vw,vh);regions.vw=vw;regions.vh=vh;regionIdx=0;}
        c=regions[regionIdx];regionIdx=(regionIdx+1)%regions.length;
      }
    }
    usedCrop=!!(c&&c===crop);searching=opt.crop&&!crop;
    if(c){
      var k=c.scale||Math.min(4,Math.max(1,640/c.w));
      cropCv.width=Math.round(c.w*k);cropCv.height=Math.round(c.h*k);
      var sx0=Math.max(0,c.x),sy0=Math.max(0,c.y),sx1=Math.min(vw,c.x+c.w),sy1=Math.min(vh,c.y+c.h);
      g2.fillStyle="#808080";g2.fillRect(0,0,cropCv.width,cropCv.height);   /* 영상 밖은 회색 */
      if(sx1>sx0&&sy1>sy0)g2.drawImage(video,sx0,sy0,sx1-sx0,sy1-sy0,(sx0-c.x)*k,(sy0-c.y)*k,(sx1-sx0)*k,(sy1-sy0)*k);
      src=cropCv;
      inReg=c===crop?{x:c.x,y:c.y,w:c.w,h:c.h,k:k}:null;
    }else inReg=null;
    var res=landmarker.detectForVideo(src,now),lm=res.faceLandmarks&&res.faceLandmarks[0],m=null;
    if(lm){
      if(c)lm=lm.map(function(p){return {x:(c.x+p.x*c.w)/vw,y:(c.y+p.y*c.h)/vh,z:p.z}});
      var mx=res.facialTransformationMatrixes&&res.facialTransformationMatrixes[0];
      m=C.measure(lm,{vw:vw,vh:vh,matrix:mx?mx.data:null,blink:readBlink(res),hfov:+$("hfov").value});
      if(m&&!C.plausible(m,c,vw))m=null;
    }
    return m;
  }
  /* 다음 프레임에 넣을 범위. 얼굴을 놓치면 처음부터 다시 찾습니다. */
  function nextCrop(m){
    var vw=video.videoWidth,vh=video.videoHeight;
    if(!m){if(crop&&++miss>5){crop=null;regionIdx=0;flush=true;}return;}
    miss=0;
    var want=C.cropAround(m.box,vw,vh);
    if(!crop||C.cropStale(crop,want)){crop=want;flush=true;}
  }
  /* 모델에 실제로 넣은 그림(얼굴을 가운데 두고 키운 것)을 거울처럼 뒤집어 보여 줍니다. */
  function drawFace(m){
    var cv=$("faceCv"),g=cv.getContext("2d"),note=$("faceNote");
    if(!(m&&usedCrop&&crop)){
      g.fillStyle=cssVar("--bg");g.fillRect(0,0,cv.width,cv.height);
      note.textContent=opt.crop?"얼굴을 찾으면 여기에 보입니다.":"얼굴을 잘라 확대해서 읽기가 꺼져 있습니다.";
      return;
    }
    if(!inReg)return;                                  /* 추적을 지우는 프레임: 직전 그림을 그대로 둡니다 */
    var vw=video.videoWidth,c=inReg,W=cv.width,k=W/c.w;
    if(cv.height!==W)cv.height=W;
    /* 모델에 넣은 그림(cropCv)을 그대로 뒤집어 옮깁니다 */
    g.imageSmoothingEnabled=true;
    g.save();g.translate(W,0);g.scale(-1,1);g.drawImage(cropCv,0,0,cropCv.width,cropCv.height,0,0,W,W);g.restore();
    var ox=vw-c.x-c.w;
    function X(x){return (x-ox)*k}
    function Y(y){return (y-c.y)*k}
    g.lineWidth=2;g.strokeStyle=cssVar("--accent");
    [m.R,m.L].forEach(function(e){
      g.beginPath();g.moveTo(X(e.a.x),Y(e.a.y));g.lineTo(X(e.up.x),Y(e.up.y));g.lineTo(X(e.b.x),Y(e.b.y));g.lineTo(X(e.low.x),Y(e.low.y));g.closePath();g.stroke();
    });
    g.strokeStyle=cssVar("--signal");
    [m.R,m.L].forEach(function(e){g.beginPath();g.arc(X(e.iris.x),Y(e.iris.y),Math.max(2,e.irisPx*k/2),0,Math.PI*2);g.stroke();});
    note.textContent="원본 얼굴 너비 "+Math.round(crop.fw)+"px 를 "+Math.round(crop.fw*c.k)+"px 로 ("+c.k.toFixed(1)+"배) 키워 모델에 넣습니다. 모델 입력 "+cropCv.width+" x "+cropCv.height;
  }
  function drawView(m){
    var vw=video.videoWidth,vh=video.videoHeight,w=view.width,h=Math.round(w*vh/vw),g=view.getContext("2d");
    if(view.height!==h)view.height=h;
    g.save();g.scale(-1,1);g.drawImage(video,-w,0,w,h);g.restore();
    var k=w/vw;g.lineWidth=3;
    if(opt.crop&&crop&&usedCrop){g.strokeStyle=cssVar("--signal");g.strokeRect((vw-crop.x-crop.w)*k,crop.y*k,crop.w*k,crop.h*k);}
    if(m){g.strokeStyle=cssVar("--accent");g.strokeRect(m.box.x0*w,m.box.y0*h,(m.box.x1-m.box.x0)*w,(m.box.y1-m.box.y0)*h);}
  }
  /* 두 눈을 원본 픽셀에서 잘라 크게 그립니다. 화면에서 왼쪽에 보이는 눈이 왼쪽에 오게 합니다. */
  function drawEyes(m){
    var g=eyeCv.getContext("2d"),W=eyeCv.width,H=eyeCv.height,vw=video.videoWidth;
    g.fillStyle=cssVar("--bg");g.fillRect(0,0,W,H);
    if(!m){eyeTx.textContent="눈을 찾는 중";return;}
    var eyes=[m.L,m.R],half=W/2,lines=[];
    /* 모델이 읽는 확대 그림에서 눈을 잘라 보여 줍니다. 단추를 누르면 확대 전 원본 픽셀을 네모 그대로 보여 줍니다. */
    var R=!opt.pixel&&usedCrop?inReg:null;
    g.imageSmoothingEnabled=!!R;
    eyes.forEach(function(e,i){
      var sw=e.w*2.2,sh=sw*H/half,k=half/sw;            /* 눈 너비의 2.2배를 한 칸 폭에 */
      var mx0=e.c.x-sw/2,my0=e.c.y-sh/2;                /* 뒤집은 좌표에서의 왼쪽 위 */
      g.save();
      g.beginPath();g.rect(i*half,0,half,H);g.clip();
      g.translate(i*half+half,0);g.scale(-1,1);          /* 원본을 뒤집어 그림 */
      if(R)g.drawImage(cropCv,(vw-mx0-sw-R.x)*R.k,(my0-R.y)*R.k,sw*R.k,sh*R.k,0,0,half,H);
      else g.drawImage(video,vw-mx0-sw,my0,sw,sh,0,0,half,H);
      g.restore();
      function px(p){return {x:i*half+(p.x-mx0)*k,y:(p.y-my0)*k}}
      var a=px(e.a),b=px(e.b),up=px(e.up),low=px(e.low),ir=px(e.iris);
      g.lineWidth=2;g.strokeStyle=cssVar("--accent");
      g.beginPath();g.moveTo(a.x,a.y);g.lineTo(up.x,up.y);g.lineTo(b.x,b.y);g.lineTo(low.x,low.y);g.closePath();g.stroke();
      g.strokeStyle=cssVar("--signal");
      g.beginPath();g.arc(ir.x,ir.y,e.irisPx*k/2,0,Math.PI*2);g.stroke();
      g.fillStyle=cssVar("--signal");g.beginPath();g.arc(ir.x,ir.y,4,0,Math.PI*2);g.fill();
      lines.push((i?"오른쪽":"왼쪽")+" 눈(화면 기준)\n 홍채 원본 "+e.irisPx.toFixed(1)+"px"+(inReg&&usedCrop?" · 모델 입력 "+(e.irisPx*inReg.k).toFixed(0)+"px":"")+"\n 눈 너비 원본 "+e.w.toFixed(0)+"px\n 좌우 "+e.hx.toFixed(3)+" 상하 "+e.hy.toFixed(3)+"\n 확대 "+k.toFixed(1)+"배");
    });
    g.strokeStyle=cssVar("--line");g.lineWidth=2;g.beginPath();g.moveTo(half,0);g.lineTo(half,H);g.stroke();
    eyeTx.textContent=lines.join("\n");
  }
  function showInfo(m){
    var set={},caps={},r=Math.round;
    try{set=track.getSettings();caps=track.getCapabilities?track.getCapabilities():{};}catch(err){}
    var z=caps.zoom,t=[];
    t.push("영상 "+video.videoWidth+" x "+video.videoHeight+" · 초당 "+r(fps.fps)+"회 (계산 "+r(inferMs)+"ms)");
    t.push("카메라 최대 "+(caps.width?caps.width.max:"?")+" x "+(caps.height?caps.height.max:"?")+" · 초당 "+(caps.frameRate?r(caps.frameRate.max):"?")+"장");
    t.push("줌 "+(z&&typeof z.max==="number"?z.min+" ~ "+z.max+"배 (지금 "+(set.zoom||"?")+"배)":"지원 안 함"));
    t.push("읽는 방법 "+(usedCrop?"얼굴을 가운데 두고 확대 (얼굴 "+r(crop.fw)+"px 를 "+r(crop.fw*crop.scale)+"px 로, "+crop.scale.toFixed(1)+"배)":(searching?"얼굴을 찾는 중 (화면을 조각으로 나눠 봄)":"화면 전체")));
    if(!m){t.push("얼굴이 보이지 않습니다");}
    else{
      var q=C.quality({irisPx:m.irisPx,fps:0,light:null});   /* 홍채 크기만 봅니다 */
      if(usedCrop&&inReg)t.push("모델 입력에서 홍채 "+r(m.irisPx*inReg.k)+"px, 얼굴 "+r(crop.fw*inReg.k)+"px ("+inReg.k.toFixed(1)+"배 확대)");
      t.push("원본 홍채 "+m.irisPx.toFixed(1)+"px ("+(q.level==="good"?"충분":(q.level==="low"?"부족":"9칸 구분 어려움"))+") · 두 눈 "+(m.eyes===2?"보임":"한쪽만"));
      t.push("얼굴 너비 "+r((m.box.x1-m.box.x0)*video.videoWidth)+"px (영상의 "+r((m.box.x1-m.box.x0)*100)+"%)");
      t.push("거리 "+r(m.distCm)+"cm (화각 "+$("hfov").value+"° 가정)");
      t.push("머리 좌우 "+r(m.yaw)+"° 상하 "+r(m.pitch)+"° 기울임 "+r(m.roll)+"°");
      t.push("눈 감김 "+(m.closed==null?"-":m.closed.toFixed(2)));
    }
    info.textContent=t.join("\n");
  }
  function loop(){
    requestAnimationFrame(loop);
    if(!landmarker||!track||video.readyState<2||!video.videoWidth||video.currentTime===lastVT)return;
    lastVT=video.currentTime;
    var now=performance.now(),m=null;
    try{m=detect(now);}catch(err){say("얼굴 인식이 멈췄습니다.");return;}
    var took=performance.now()-now;inferMs=inferMs?inferMs*0.9+took*0.1:took;fps.update(now);
    lastM=m;
    say(m?"":(searching?"얼굴을 찾고 있습니다":"얼굴이 보이지 않습니다. 카메라가 얼굴을 보게 해 주세요"));
    drawView(m);drawFace(m);drawEyes(m);showInfo(m);
    if(opt.crop)nextCrop(m);
  }
  function fitEyes(){document.body.style.setProperty("--eyes-h",$("eyes").offsetHeight+"px")}
  window.addEventListener("resize",fitEyes);fitEyes();

  openCamera().then(loadModel).then(function(){say("");fitEyes();requestAnimationFrame(loop);}).catch(function(err){say(why(err))});
  /* 시험할 때 값을 읽어 보려고 열어 둡니다 */
  window.NundamDebug={state:function(){return {m:lastM,crop:crop,usedCrop:usedCrop,fps:fps.fps}}};
})();
</script>
